<script>
window.bungFail = (err) => {
  if (document.getElementById('boot-error')) return;
  const e = err || {};
  const message = e.message || (typeof err === 'string' ? err : '') || 'The game failed to start.';
  const where = e.filename ? '\n' + e.filename + ':' + (e.lineno || '') : '';
  const stack = e.stack && e.stack !== message ? '\n' + e.stack : '';
  const box = document.createElement('pre');
  box.id = 'boot-error';
  box.textContent = message + where + stack + '\n\nClick to dismiss.';
  box.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;z-index:80;margin:0;padding:16px 18px;background:#141820;color:#fff;border:3px solid #ffc94d;border-radius:16px;font:15px/1.4 Nunito,sans-serif;white-space:pre-wrap;cursor:pointer';
  box.onclick = () => box.remove();
  document.body.appendChild(box);
};
window.addEventListener('error', (e) => {
  if (e.target && e.target !== window) return;
  window.bungFail({
    message: e.message,
    filename: e.filename,
    lineno: e.lineno,
    stack: e.error && e.error.stack,
  });
});
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  window.bungFail(r instanceof Error ? r : { message: String(r && r.stack || r) });
});
</script>
